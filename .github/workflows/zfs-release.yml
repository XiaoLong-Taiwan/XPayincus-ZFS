name: Build and Release ZFS Modules

on:
  workflow_dispatch:
    inputs:
      kernel_version_base:
        description: Debian kernel version without architecture suffix, for example 6.1.0-37
        required: true
        default: 6.1.0-37
      release_tag:
        description: GitHub Release tag used by XPayincus install.sh
        required: true
        default: Debian-ZFS

jobs:
  build:
    name: Build ZFS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            kernel_suffix: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            kernel_suffix: arm64
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y ca-certificates bash coreutils grep

      - name: Build selected kernel package
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_VERSION="${{ inputs.kernel_version_base }}-${{ matrix.kernel_suffix }}"
          printf 'y\n' | bash zfs-builder.sh --kernel "${KERNEL_VERSION}"
          test -n "$(find output -maxdepth 1 -name "xpayincus-zfs-*-linux-${{ matrix.arch }}-${KERNEL_VERSION}.tar.gz" -print -quit)"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_VERSION="${{ inputs.kernel_version_base }}-${{ matrix.kernel_suffix }}"
          cd output
          sha256sum xpayincus-zfs-*-linux-${{ matrix.arch }}-${KERNEL_VERSION}.tar.gz > checksums-${{ matrix.arch }}.txt

      - name: Upload ZFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpayincus-zfs-${{ matrix.arch }}-${{ inputs.kernel_version_base }}-${{ matrix.kernel_suffix }}
          path: |
            output/xpayincus-zfs-*-linux-${{ matrix.arch }}-${{ inputs.kernel_version_base }}-${{ matrix.kernel_suffix }}.tar.gz
            output/checksums-${{ matrix.arch }}.txt
          retention-days: 30

  release:
    name: Publish ZFS Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ZFS artifacts
        uses: actions/download-artifact@v4
        with:
          path: zfs-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find zfs-artifacts -type f -name 'xpayincus-zfs-*.tar.gz' -exec mv {} release/ \;
          find zfs-artifacts -type f -name 'checksums-*.txt' -exec cat {} \; > release/checksums.txt
          test -n "$(find release -maxdepth 1 -name 'xpayincus-zfs-*.tar.gz' -print -quit)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: XPayincus ZFS ${{ inputs.release_tag }}
          files: |
            release/xpayincus-zfs-*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
